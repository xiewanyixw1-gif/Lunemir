[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.25.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
